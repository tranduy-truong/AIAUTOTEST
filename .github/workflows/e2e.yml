name: E2E Tests (Playwright)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Prepare auth config (optional)
        run: |
          mkdir -p .auth
          if [ -n "$AUTH_LOGIN_URL" ]; then
            printf '{"strategy":"PLAYWRIGHT_STORAGE_STATE","loginUrl":"%s","username":"%s","password":"%s","expectedRedirectUrl":"%s"}' \
              "$AUTH_LOGIN_URL" "$AUTH_USERNAME" "$AUTH_PASSWORD" "$AUTH_REDIRECT_URL" > .auth/ci-config.json
          fi
        env:
          AUTH_LOGIN_URL: ${{ secrets.AUTH_LOGIN_URL }}
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_REDIRECT_URL: ${{ secrets.AUTH_REDIRECT_URL }}

      - name: Run E2E Tests
        run: npm run test:e2e -- --non-interactive --auth-config .auth/ci-config.json
        env:
          E2E_CRAWLER_HEADLESS: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
