  /dema/api/groups/{parentGroupId}/permissions/:
    get:
      operationId: groupsPermissionsList
      description: |-
        NestedViewSetMixin that 404s when the immediate parent is out of scope.

        Subclasses must declare ``parent_viewset_class`` (a viewset whose
        ``get_queryset`` already applies access scope). For multi-level routes,
        only the innermost ``parent_*`` kwarg is resolved — scoping on that parent
        viewset covers the chain. Outer ``parent_*`` kwargs are forwarded to the
        parent viewset; the innermost (child) kwarg is dropped.

        ``parent_lookup_field`` is the field used on the parent queryset (default
        ``pk``).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Trường dùng để sắp xếp kết quả.
        schema:
          type: string
      - in: path
        name: parentGroupId
        schema:
          type: integer
        description: Group ID
        required: true
      - name: search
        required: false
        in: query
        description: Từ khóa tìm kiếm.
        schema:
          type: string
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
          description: ''
