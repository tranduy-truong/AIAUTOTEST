openapi: 3.0.3
info:
  title: DRF Start Kit API
  version: 1.0.0
  description: Starter API built with Django REST Framework.
paths:
  /dema/api/approval-requests/:
    get:
      operationId: approvalRequestsList
      parameters:
      - in: query
        name: contentType
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Số kết quả trả về mỗi trang.
        schema:
          type: integer
      - in: query
        name: objectId
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: Vị trí bắt đầu để trả kết quả.
        schema:
          type: integer
      - in: query
        name: operation
        schema:
          type: string
          enum:
          - create
          - update
        description: |-
          * `create` - Tạo
          * `update` - Cập nhật
      - name: ordering
        required: false
        in: query
        description: Trường dùng để sắp xếp kết quả.
        schema:
          type: string
      - in: query
        name: requester
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: Từ khóa tìm kiếm.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - cancelled
          - pending
          - rejected
        description: |-
          * `pending` - Đang chờ
          * `approved` - Đã duyệt
          * `rejected` - Từ chối
          * `cancelled` - Đã hủy
      tags:
      - Yêu cầu phê duyệt
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestListList'
          description: ''
